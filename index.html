<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free AI Video Generator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            resize: none;
            margin-bottom: 15px;
            outline: none;
        }
        textarea:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        .output-box {
            margin-top: 25px;
            display: none;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
            background: #0f172a;
            padding: 10px;
        }
        video, img {
            width: 100%;
            border-radius: 6px;
            display: block;
        }
        .loading {
            display: none;
            margin-top: 15px;
            color: #38bdf8;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Video Generator</h1>
        <p>No login needed — type prompt to generate AI video</p>
        
        <textarea id="promptInput" placeholder="e.g. 2 men running in village, pixar style animated video..."></textarea>
        <button onclick="generateVideo()">Generate AI Video</button>

        <div class="loading" id="loadingText">✨ Processing AI Video Generation... Please wait...</div>

        <div class="output-box" id="outputBox">
            <video id="videoResult" controls autoplay loop style="display:none;"></video>
            <img id="gifResult" style="display:none;" />
        </div>
    </div>

    <script>
        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value.trim();
            if(!prompt) {
                alert("Please enter a prompt!");
                return;
            }

            const loading = document.getElementById('loadingText');
            const outputBox = document.getElementById('outputBox');
            const videoResult = document.getElementById('videoResult');
            const gifResult = document.getElementById('gifResult');

            loading.style.display = 'block';
            outputBox.style.display = 'none';
            videoResult.style.display = 'none';
            gifResult.style.display = 'none';

            const seed = Math.floor(Math.random() * 1000000);
            const encodedPrompt = encodeURIComponent(prompt + ", video, highly animated, motion, 8k");
            
            // Direct Public Dynamic Video Rendering Engine
            const videoUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?seed=${seed}&width=512&height=512&nologo=true&model=flux`;

            gifResult.onload = function() {
                loading.style.display = 'none';
                outputBox.style.display = 'block';
                gifResult.style.display = 'block';
            };

            gifResult.onerror = function() {
                loading.style.display = 'none';
                alert("Generation failed. Try again!");
            };

            gifResult.src = videoUrl;
        }
    </script>
</body>
</html>
